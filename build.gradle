plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'io.github.daniel99412'

def getVersion = {
    def envVersion = System.getenv('VERSION')
    if (envVersion != null && !envVersion.isBlank()) {
        return envVersion.startsWith('v') ? envVersion.substring(1) : envVersion
    }
    '1.0.0'
}

version = getVersion()

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testImplementation libs.archunit
    testImplementation libs.equalsverifier
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

pitest {
    targetClasses = ['io.github.daniel99412.outcome.*']
    targetTests = ['io.github.daniel99412.outcome.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    mutationThreshold = 85
    coverageThreshold = 85
    verbose = false
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            pom {
                name = 'outcome'
                description = 'A small, immutable, dependency-free result type for Java 21+.'
                url = 'https://github.com/daniel99412/Outcome'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'daniel99412'
                        name = 'Daniel Pardo'
                        email = 'daniel.pardo194@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:daniel99412/Outcome.git'
                    developerConnection = 'scm:git:git@github.com:daniel99412/Outcome.git'
                    url = 'https://github.com/daniel99412/Outcome'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'central'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials(PasswordCredentials) {
                username = System.getenv('SONATYPE_USERNAME')
                password = System.getenv('SONATYPE_PASSWORD')
            }
        }
    }
}

signing {
    def key = System.getenv('GPG_PRIVATE_KEY')
    if (key != null && !key.isBlank()) {
        useInMemoryPgpKeys(key, System.getenv('GPG_PASSPHRASE') ?: '')
    }
    sign publishing.publications.mavenJava
}
